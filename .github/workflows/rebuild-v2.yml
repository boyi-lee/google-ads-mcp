name: Rebuild v2 CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ rebuild-v2 ]

jobs:
  v2-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Syntax check
        run: python -m py_compile ads_mcp_v2/server.py
      - name: Run v2 tests
        run: pytest -q tests/test_v2.py
      - name: Build Docker image
        run: docker build -t google-ads-mcp-v2:ci .
